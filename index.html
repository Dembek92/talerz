<style>
:root{
  --paper:#EDF0F3; --surface:#FFFFFF; --ink:#172033; --muted:#5B6577; --line:#CBD2DB;
  --red:#D7263D; --blue:#1F5FD1; --yellow:#E0A800; --green:#1E9E5A;
  --on-accent:#FFFFFF;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#10151F; --surface:#1A2130; --ink:#E9EDF3; --muted:#98A2B5; --line:#2C3546;
    --red:#F0475C; --blue:#4D85F0; --yellow:#F2C230; --green:#34C27A;
    --on-accent:#10151F;
    color-scheme: dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:'Barlow',system-ui,sans-serif;font-size:16px;line-height:1.45;min-height:100vh;padding-bottom:84px}
h1,h2,h3,.cond{font-family:'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.01em}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 18px 20px}
header.top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px}
header.top h1{font-size:40px;font-weight:800;line-height:1}
header.top p{color:var(--muted);font-size:14px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--ink);border-bottom:1px solid var(--line);margin-bottom:26px}
.stats div{padding:10px 0}
.stats div+div{padding-left:12px;border-left:1px solid var(--line)}
.stats b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;line-height:1.1}
.stats span{font-size:13px;color:var(--muted)}

h2{font-size:24px;font-weight:700;margin:4px 0 12px}
.plan{display:flex;align-items:stretch;background:var(--surface);border-radius:6px;margin-bottom:10px;overflow:hidden;border:1px solid var(--line)}
.plan .edge{width:14px;flex:none}
.plan .body{flex:1;padding:14px 14px 12px;min-width:0}
.plan h3{font-size:22px;font-weight:700;line-height:1.1}
.plan p{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan .acts{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:6px;padding:10px 16px;font-weight:600;font-size:15px;min-height:44px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.ghost{border:1px solid var(--line);color:var(--ink);background:var(--surface)}
.btn.small{padding:6px 12px;min-height:36px;font-size:14px}
.btn.full{width:100%}
.btn.danger{color:var(--red);border:1px solid var(--line);background:var(--surface)}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--ink);color:var(--paper);border-radius:6px;padding:14px 16px;margin-bottom:22px}
.resume .btn{background:var(--paper);color:var(--ink)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;max-width:280px;padding:14px 0 16px;font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;color:var(--muted);border-top:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--ink)}

/* workout */
.wk-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.wk-head h1{font-size:30px;font-weight:800;line-height:1}
.wk-head .time{font-family:'Barlow Condensed',sans-serif;font-size:18px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -18px 8px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.chips button{flex:none;max-width:230px;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips button.done{text-decoration:line-through;color:var(--muted)}
.exname{font-size:28px;font-weight:700;line-height:1.1;margin:10px 0 2px}
.extarget{color:var(--muted);font-size:15px}
.ring{position:relative;width:230px;height:230px;margin:18px auto 14px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--line)}
.ring .bar{transition:stroke-dashoffset .4s ease}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-family:'Barlow Condensed',sans-serif;font-size:58px;font-weight:800;line-height:1}
.ring .lbl{font-size:14px;color:var(--muted)}
.ring .center .btn{margin-top:8px}
.inputs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:12px}
.inputs.stack{grid-template-columns:minmax(0,1fr)}
.inputs.stack .stepper button{width:64px}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}
.stepper button{flex:none;width:44px;font-size:22px;font-weight:600}
.stepper input{flex:1;min-width:0;width:100%;border:none;background:transparent;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;padding:6px 0}
.sets{list-style:none;margin:16px 0}
.sets li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.sets li b{font-family:'Barlow Condensed',sans-serif;font-size:20px}
.sets li .x{color:var(--muted);width:36px;height:36px;font-size:20px}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* history */
.hist{background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-bottom:10px;overflow:hidden}
.hist summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.hist summary::-webkit-details-marker{display:none}
.hist .dot{width:12px;height:12px;border-radius:50%;flex:none}
.hist .t{flex:1;min-width:0}
.hist h3{font-size:20px;font-weight:700;line-height:1.1}
.hist p{font-size:13px;color:var(--muted)}
.hist .vol{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;white-space:nowrap}
.hist .detail{padding:0 14px 12px;font-size:14px}
.hist .detail div{display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid var(--line)}
.hist .detail span:last-child{color:var(--muted);text-align:right}
.empty{padding:30px 0;color:var(--muted)}
.empty .btn{margin-top:12px}

/* editor */
.ed label{display:block;font-size:14px;color:var(--muted);margin:14px 0 4px}
.ed input{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:10px 12px;font-size:16px}
.swatches{display:flex;gap:10px}
.swatches button{width:40px;height:40px;border-radius:50%;border:3px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--surface)}
.exrow{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;margin-top:10px}
.exrow .grid{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-top:8px;align-items:end}
.exrow .grid label{margin:0 0 2px;font-size:12px}
.exrow .grid input{padding:8px;text-align:center}
.exrow .x{width:40px;height:40px;color:var(--red);font-size:20px}
.foot{display:flex;gap:10px;margin-top:20px}
.foot>*{flex:1}
 .seg{display:flex;gap:8px}
.seg button{flex:1;border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--surface);font-weight:600;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.kcal{margin:20px 0 6px;display:flex;align-items:baseline;gap:10px;border-top:2px solid var(--ink);padding-top:10px}
.kcal b{font-family:'Barlow Condensed',sans-serif;font-size:52px;font-weight:800;line-height:1}
.kcal span{color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:4px}
.who{font-size:14px;color:var(--muted);margin-top:14px}
.linkbtn{color:var(--blue);font-weight:600;text-decoration:underline;padding:6px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.opt span{font-size:15px}
.sw{flex:none;width:52px;height:32px;border-radius:16px;background:var(--line);position:relative}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);transition:left .15s}
.sw[aria-pressed="true"]{background:var(--green)}
.sw[aria-pressed="true"]::after{left:23px}
.exhead{display:flex;align-items:center;gap:6px}
.exhead .num{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;width:22px;flex:none}
.exhead input{flex:1;min-width:0}
.mv{flex:none;width:40px;height:40px;border:1px solid var(--line);border-radius:6px;font-size:18px;background:var(--surface)}
.mv:disabled{opacity:.3;cursor:default}
.exrow.moved{outline:2px solid var(--blue);outline-offset:-1px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:22px}
.prog h3{font-size:22px;font-weight:700;line-height:1.1}
.prog p{font-size:14px;color:var(--muted)}
.prog .now{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;margin-top:8px}
.weeks{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:10px 0 6px}
.weeks span{height:10px;border-radius:2px;background:var(--line)}
.weeks span.p1{background:var(--blue);opacity:.35}.weeks span.p2{background:var(--red);opacity:.35}.weeks span.dl{background:var(--muted);opacity:.35}
.weeks span.cur{opacity:1}
.prog .row{margin-top:10px}
.prog .datefield{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--muted)}
.prog .datefield input{border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:6px 8px;font-size:15px}
.extip{white-space:pre-line;font-size:14px;color:var(--muted);margin-top:6px;border-left:3px solid var(--line);padding-left:8px}
.plan .hint{color:var(--ink);font-weight:600}
.fixed{grid-column:span 2;font-size:13px;color:var(--muted);align-self:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}
.card h3{font-size:20px;font-weight:700;line-height:1.15}
.card .sub{font-size:13px;color:var(--muted)}
.chart{display:block;width:100%;height:auto;margin-top:8px;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:11px;font-family:'Barlow',sans-serif}
.chart .bar{fill:var(--blue)}
.chart .bar.sel{fill:var(--ink)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .line{fill:none;stroke:var(--blue);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--blue);stroke:var(--surface);stroke-width:2}

const DEFAULT_SETTINGS = {sound:true, countdown:true, awake:true};
let S = {plans: DEFAULT_PLANS, history: [], active: null, profile: null, settings: {...DEFAULT_SETTINGS}, program: null};
let view = 'plans';
let editing = null;
let toastTimer;

/* ---------- storage ---------- */
const KEY='talerz-data';
let warned=false;
function applyData(raw){
  const d = JSON.parse(raw);
  S = {plans: d.plans || DEFAULT_PLANS, history: d.history || [], active: d.active || null, profile: d.profile || null, settings: {...DEFAULT_SETTINGS, ...(d.settings||{})}, program: d.program || null, adjApplied: d.adjApplied || []};
}
async function load(){
  try{
    if(window.storage){
      const r = await window.storage.get(KEY, false);
      if(r && r.value){ applyData(r.value); return; }
    }
  }catch(e){ /* brak zapisu w pamięci Claude */ }
  try{
    const v = localStorage.getItem(KEY);
    if(v){ applyData(v); return; }
  }catch(e){ /* pamięć przeglądarki niedostępna */ }
}
async function save(){
  const json = JSON.stringify(S);
  try{
    if(window.storage){
      const r = await window.storage.set(KEY, json, false);
      if(r) return;
    }
  }catch(e){}
  try{ localStorage.setItem(KEY, json); return; }catch(e){}
  if(!warned){
    warned=true;
    toast('Zapis automatyczny niedostępny. Użyj „Kopia zapasowa” w zakładce Plany.');
  }
}
function toast(msg){
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg; t.setAttribute('role','status');
  document.body.appendChild(t); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.remove(),2200);
}

/* ---------- alarm i ekran ---------- */
let actx = null, lastBeep = null, wakeLock = null;
function unlockAudio(){
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    g.gain.value = 0; o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime + 0.02);
  }catch(e){}
}
function beep(freq, start, dur, vol){
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, start);
  g.gain.linearRampToValueAtTime(vol, start + 0.01);
  g.gain.setValueAtTime(vol, start + dur - 0.02);
  g.gain.linearRampToValueAtTime(0, start + dur);
  o.connect(g).connect(actx.destination);
  o.start(start); o.stop(start + dur + 0.02);
}
function tick(){
  if(!S.settings.sound || !S.settings.countdown || !actx) return;
  try{ beep(880, actx.currentTime, 0.1, 0.18); }catch(e){}
}
function ringAlarm(force){
  if(navigator.vibrate) try{ navigator.vibrate([300,150,300,150,300]); }catch(e){}
  if((!S.settings.sound && !force) || !actx) return;
  try{
    if(actx.state === 'suspended') actx.resume();
    const t = actx.currentTime + 0.05;
    for(let i=0;i<3;i++){
      beep(1047, t + i*0.6, 0.16, 0.3);
      beep(1319, t + i*0.6 + 0.2, 0.22, 0.3);
    }
  }catch(e){}
}
async function keepAwake(){
  if(!S.settings.awake || !S.active || wakeLock || !('wakeLock' in navigator)) return;
  try{
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  }catch(e){ wakeLock = null; }
}
function releaseAwake(){ try{ wakeLock?.release(); }catch(e){} wakeLock = null; }
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && S.active) keepAwake();
});

/* ---------- helpers ---------- */
const fmtTime = s => { s=Math.max(0,Math.round(s)); const m=Math.floor(s/60), r=s%60; return m+':'+String(r).padStart(2,'0'); };
const fmtDur = ms => { const m=Math.round(ms/60000); return m<60? m+' min' : Math.floor(m/60)+' h '+(m%60)+' min'; };
const fmtDate = ts => new Date(ts).toLocaleDateString('pl-PL',{weekday:'short',day:'numeric',month:'long'});
const fmtKg = n => (Math.round(n*10)/10).toLocaleString('pl-PL');
function lastWeight(name){
  for(let i=S.history.length-1;i>=0;i--){
    const e = S.history[i].exercises.find(x=>x.name===name && x.done.length);
    if(e) return e.done[e.done.length-1].kg;
  }
  return 0;
}
function weekStart(){ const d=new Date(); const day=(d.getDay()+6)%7; d.setHours(0,0,0,0); d.setDate(d.getDate()-day); return d.getTime(); }

/* ---------- program ---------- */
const DAY = 86400000;
function parseDay(str){ const [y,m,d] = String(str).split('-').map(Number); return new Date(y, m-1, d).getTime(); }
function todayStart(){ const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function progStatus(){
  if(!S.program) return null;
  const diff = Math.round((todayStart() - parseDay(S.program.start)) / DAY);
  const raw = Math.floor(diff / 7) + 1;
  return { week: Math.min(8, Math.max(1, raw)), before: diff < 0, daysTo: -diff, after: raw > 8 };
}
function progWeek(){ return progStatus()?.week || 1; }
function effEx(x, plan){
  if(!x.weeks || !S.program || plan.programId !== S.program.id) return {...x};
  const w = progWeek(), wk = x.weeks[w] || {};
  const e = {...x, ...wk};
  if(w >= 5 && w <= 7 && x.rest > 15) e.rest = x.rest + (x.star ? 60 : 15);
  delete e.weeks;
  return e;
}

const r25 = v => Math.round(v/2.5)*2.5;
function wuItem(k){ return {...WARMUP[k], warmup:true, sets:1, reps:1, rest:0}; }
function rampFor(x, first){
  const pct = first ? [0.5,0.7,0.85] : [0.5,0.7], reps = first ? [8,5,3] : [8,5];
  const weeks = {};

/* Wzór Keytel i wsp. (2005): kcal/min z tętna, wagi, wieku i płci */
function calcKcal(hr, minutes, prof){
  hr = parseFloat(hr); minutes = parseFloat(minutes);
  const age = parseFloat(prof?.age), w = parseFloat(String(prof?.weight).replace(',','.'));
  if(!(hr>=40 && hr<=220) || !(minutes>0) || !(age>=10 && age<=100) || !(w>=30 && w<=300)) return null;
  const perMin = prof.sex==='k'
    ? (-20.4022 + 0.4472*hr - 0.1263*w + 0.074*age) / 4.184
    : (-55.0969 + 0.6309*hr + 0.1988*w + 0.2017*age) / 4.184;
  return Math.max(0, Math.round(perMin*minutes));
}
function updKcal(){
  const f = S.active?.fin; const el = document.getElementById('kcalOut');
  if(!f || !el) return;
  const k = calcKcal(f.hr, f.minutes, f.prof);

}

const e1rm = (kg, reps) => (kg > 0 && reps > 0 && reps <= 12) ? kg * (1 + reps/30) : 0;
const isBarbell = n => /sztang|martwy ciąg|przysiad przedni|zerchera/i.test(n);
const bigStep = n => /martwy ciąg|przysiad/i.test(n) && !/goblet/i.test(n);
const repHi = t => { const m = String(t?.label||'').match(/^(\d+)(?:–(\d+))?/); return m ? +(m[2]||m[1]) : (t?.reps || 0); };
const fmtShort = ts => new Date(ts).toLocaleDateString('pl-PL',{day:'numeric',month:'numeric'});
let volSel = null;
const plTren = n => n===1 ? 'trening' : (n%10>=2 && n%10<=4 && (n%100<10 || n%100>=20)) ? 'treningi' : 'treningów';

function liftSessions(){
  const map = new Map();
  S.history.forEach(h => h.exercises.forEach(x => {
    if(x.warmup || !x.done.length) return;
    const best = Math.max(0, ...x.done.map(d => e1rm(d.kg, d.reps)));
    if(!best) return;
    if(!map.has(x.name)) map.set(x.name, {name:x.name, star:false, list:[]});
    const L = map.get(x.name);
    L.star = L.star || !!x.target?.star;
    L.list.push({ts:h.startedAt, best, top:Math.max(...x.done.map(d=>d.kg)), week:h.week, x});
  }));
  return [...map.values()].sort((a,b) => (b.star-a.star) || (b.list.length-a.list.length));
}
function weeklyVolume(){
  const ws = weekStart(), out = [];
  for(let i=7;i>=0;i--){
    const from = ws - i*7*DAY, to = from + 7*DAY;
    const hs = S.history.filter(h=>h.startedAt>=from && h.startedAt<to);
    out.push({from, vol: hs.reduce((a,h)=>a+h.volume,0), n: hs.length});
  }
  return out;
}
function advice(lifts){
  const tips = [];
  if(S.program){
    const done = new Set(S.history.filter(h=>h.startedAt>=weekStart() && h.week!=null).map(h=>h.programKey==='test' ? 'd4' : (h.programKey || h.name)));
    const n = Math.min(4, done.size);
    const st = progStatus();
    if(!st.before) tips.push({k: n>=4 ? 'up' : 'info', t: n>=4 ? 'Komplet: 4 z 4 treningów programu w tym tygodniu' : `W tym tygodniu ${n} z 4 treningów programu`, s:`Tydzień ${st.week} z 8 · ${PROGRAM.phases[st.week]} · ${PROGRAM.rir[st.week]}`});
  }
  lifts.forEach(L => {
    const last = L.list[L.list.length-1], x = last.x, t = x.target;
    if(!t) return;
    const hi = repHi(t), work = x.done;
    if(t.sets && work.length < t.sets){
      tips.push({k:'warn', t:`${L.name}: ${work.length} z ${t.sets} serii`, s:`Ostatni trening, ${fmtShort(last.ts)}. Jeśli to przez zmęczenie, zostań przy tym ciężarze.`});
      return;
    }
    const deloadNow = S.program && [4,8].includes(progWeek());
    if(hi && isBarbell(L.name) && work.every(d=>d.reps>=hi) && last.week!==4 && last.week!==8 && !deloadNow && Date.now()-last.ts < 10*DAY){
      const step = bigStep(L.name) ? 5 : 2.5;
      tips.push({k:'up', t:`${L.name}: dodaj +${fmtKg(step)} kg`, s:`Wszystkie serie na górnej granicy (${hi} powt.). Wg planu na następnym treningu weź ${fmtKg(step)} kg więcej niż podpowiada aplikacja.`});
      return;
    }
    if(t.kg && last.top < t.kg*0.95){
      tips.push({k:'warn', t:`${L.name}: ${fmtKg(last.top)} kg zamiast ${fmtKg(t.kg)} kg`, s:'Plan każe trzymać się RIR, nie liczb z tabeli. Jeśli zapas powtórzeń się zgadzał, wszystko w porządku.'});
    }
  });
  lifts.forEach(L => {
    const pts = L.list.filter(p => p.week!==4 && p.week!==8);
    if(pts.length < 4) return;
    const lastThree = pts.slice(-3), before = Math.max(...pts.slice(0,-3).map(p=>p.best));
    if(Math.max(...lastThree.map(p=>p.best)) <= before){
      tips.push({k:'warn', t:`${L.name}: brak wzrostu od 3 sesji`, s:'Sprawdź sen, jedzenie i technikę. Jeśli to się powtórzy, zostań na tym ciężarze tydzień dłużej.'});
    }
  });
  const order = {info:0, warn:1, up:2};
  const head = tips.shift();
  return [head, ...tips.sort((a,b)=>order[a.k]-order[b.k])].filter(Boolean).slice(0, 5);
}
function volChart(weeks){
  const W = 340, H = 140, padL = 4, padB = 22, padT = 18;
  const max = Math.max(1, ...weeks.map(w=>w.vol));
  const bw = (W - padL) / weeks.length, inner = Math.min(26, bw - 10);
  const y = v => padT + (H - padT - padB) * (1 - v/max);
  const bars = weeks.map((w,i) => {
    const x = padL + i*bw + (bw-inner)/2, top = y(w.vol), h = (H-padB) - top;
    const r = Math.min(4, h/2);
    const path = w.vol ? `M${x},${H-padB} V${top+r} Q${x},${top} ${x+r},${top} H${x+inner-r} Q${x+inner},${top} ${x+inner},${top+r} V${H-padB} Z` : '';
    return `${path?`<path class="bar${volSel===i?' sel':''}" d="${path}"/>`:''}
      <rect class="hit" x="${padL+i*bw}" y="0" width="${bw}" height="${H}" data-a="volBar" data-i="${i}"><title>${fmtShort(w.from)}: ${fmtKg(Math.round(w.vol))} kg</title></rect>
      <text class="axis" x="${x+inner/2}" y="${H-6}" text-anchor="middle">${fmtShort(w.from)}</text>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tonaż w ostatnich 8 tygodniach">
    <line class="grid" x1="0" x2="${W}" y1="${H-padB}" y2="${H-padB}"/>
    <line class="grid" x1="0" x2="${W}" y1="${padT}" y2="${padT}" stroke-dasharray="2 4"/>
    <text class="axis" x="0" y="${padT-6}">${fmtKg(Math.round(max/100)/10)} t</text>
    ${bars}</svg>`;
}
function spark(list){
  const W = 110, H = 40, p = 5;
  const vals = list.map(l=>l.best), mn = Math.min(...vals), mx = Math.max(...vals), rng = (mx-mn) || 1;
  const pts = vals.map((v,i)=>[p + (W-2*p) * (vals.length===1 ? 1 : i/(vals.length-1)), H-p - (H-2*p) * ((v-mn)/rng)]);
  const last = pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" aria-hidden="true" style="margin:0">
    ${pts.length>1?`<polyline class="line" points="${pts.map(q=>q.map(n=>n.toFixed(1)).join(',')).join(' ')}"/>`:''}
    <circle class="dot" cx="${last[0]}" cy="${last[1]}" r="4.5"/></svg>`;
}

function buildReport(){
  const from = Date.now() - 56*DAY;
  const hs = S.history.filter(h=>h.startedAt>=from);
  const L = [];
  L.push('Przeanalizuj moje postępy treningowe. Oceń, czy robię progres, gdzie stoję w miejscu, czy ciężary są dobrze dobrane i co zmienić w kolejnych tygodniach. Odpowiedz po polsku, konkretnie.');
  L.push('');
  if(S.program){ const st = progStatus(); L.push(`Program: ${PROGRAM.name}, start ${S.program.start}, teraz tydzień ${st.week} z 8 (${PROGRAM.phases[st.week]}, ${PROGRAM.rir[st.week]}). 4 treningi w tygodniu.`); }
  if(S.profile) L.push(`Ja: ${S.profile.sex==='k'?'kobieta':'mężczyzna'}, ${S.profile.age} lat, ${S.profile.weight} kg.`);
  L.push(`Treningi z ostatnich 8 tygodni: ${hs.length}. Zapis serii: ciężar×powtórzenia, „mc” = masa ciała. W nawiasie cel z planu.`, '');
  hs.forEach(h => {
    L.push(`${new Date(h.startedAt).toLocaleDateString('pl-PL')} – ${h.name}${h.week?` (tydz. ${h.week})`:''}, ${fmtDur(h.duration)}${h.kcal!=null?`, ${h.kcal} kcal, tętno ${h.hr}`:''}`);
    h.exercises.filter(x=>!x.warmup && x.done.length).forEach(x => {
      const t = x.target;
      const goal = t ? ` [plan: ${t.sets} × ${t.label || t.reps}${t.kg?` @ ${fmtKg(t.kg)} kg`:''}]` : '';
      L.push(`  • ${x.name}${goal}: ${x.done.map(d=>`${d.kg ? fmtKg(d.kg)+' kg' : 'mc'}×${d.reps}`).join(', ')}`);
    });
  });
  return L.join('\n');
}

/* ---------- workout logic ---------- */
function setDefaults(){
  const a = S.active, e = a.exercises[a.exIdx];
  const n = e.done.length, last = e.done[n-1];
  if(e.setKg && n < e.setKg.length){ a.cur = {kg: e.setKg[n], reps: (e.setReps||[])[n] ?? e.reps}; return; }
  a.cur = {kg: last ? last.kg : (e.kg != null ? e.kg : lastWeight(e.name)), reps: last ? last.reps : e.reps};
}

const actions = {
  tab: d => { view = d.v; editing = null; render(); window.scrollTo(0,0); },
  resume: () => { view = S.active.fin ? 'finish' : 'workout'; unlockAudio(); keepAwake(); render(); },
  plansFromWorkout: () => { view='plans'; render(); },
  start: d => {
    const p = S.plans.find(x=>x.id===d.id); if(!p) return;
    S.active = {planId:p.id, name:p.name, color:p.color, programKey: p.programKey ?? null, week: (S.program && p.programId===S.program.id) ? progWeek() : null, startedAt:Date.now(), exIdx:0, restEnd:null, restTotal:0,
      exercises: p.exercises.map(x=>effEx(x,p)).filter(x=>x.sets>0).map(x=>({...x, done:[]})), cur:{kg:0,reps:0}};
    if(!S.active.exercises.length){ S.active=null; toast('Ten plan nie ma ćwiczeń w tym tygodniu'); render(); return; }
    setDefaults(); view='workout'; unlockAudio(); keepAwake(); save(); render(); window.scrollTo(0,0);
  },
  goEx: d => {
    const i = +d.i, a = S.active; if(i<0||i>=a.exercises.length) return;
    a.exIdx = i; setDefaults(); save(); render();
  },
  step: d => {
    const a = S.active, f = d.f;
    let v = (parseFloat(String(a.cur[f]).replace(',','.'))||0) + parseFloat(d.d);
    a.cur[f] = Math.max(0, Math.round(v*10)/10);
    document.getElementById(f).value = a.cur[f];
  },
  logSet: () => {
    const a = S.active, e = a.exercises[a.exIdx];
    const kg = parseFloat(String(a.cur.kg).replace(',','.'))||0;
    const reps = parseInt(a.cur.reps)||0;
    if(reps<=0){ toast('Wpisz liczbę powtórzeń'); return; }
    e.done.push({kg, reps});
    if(e.setKg) setDefaults();
    if(e.done.length >= e.sets && a.exIdx < a.exercises.length-1){
      toast('Ćwiczenie zrobione — czas na następne');
    }
    if(e.rest > 0){ a.restTotal = e.rest; a.restEnd = Date.now() + e.rest*1000; lastBeep = null; }
    else if(e.done.length >= e.sets && a.exIdx < a.exercises.length-1){ a.exIdx++; setDefaults(); }
    unlockAudio(); keepAwake();
    save(); render();
  },
  volBar: d => { volSel = volSel===+d.i ? null : +d.i; render(); },
  copyReport: async () => {
    const txt = buildReport();
    try{ await navigator.clipboard.writeText(txt); toast('Raport skopiowany — wklej go w rozmowie z Claude'); }
    catch(e){ window.prompt('Skopiuj ten raport i wklej go w rozmowie z Claude:', txt); }
  },
  doneWarm: () => {
    const a = S.active, e = a.exercises[a.exIdx];
    if(!e.done.length) e.done.push({kg:0, reps:1});
    if(a.exIdx < a.exercises.length-1){ a.exIdx++; setDefaults(); }
    unlockAudio(); keepAwake(); save(); render(); window.scrollTo(0,0);
  },
  delSet: d => { const e = S.active.exercises[S.active.exIdx]; e.done.splice(+d.i,1); save(); render(); },
  skipRest: () => {
    const a = S.active; a.restEnd = null;
    const e = a.exercises[a.exIdx];
    if(e.done.length >= e.sets && a.exIdx < a.exercises.length-1){ a.exIdx++; setDefaults(); }
    save(); render();
  },
  finish: () => {
    const a = S.active;
    const setCount = a.exercises.filter(x=>!x.warmup).reduce((n,x)=>n+x.done.length,0);
    if(setCount===0){
      if(!confirm('Nie zapisano żadnej serii. Odrzucić ten trening?')) return;
      releaseAwake(); S.active=null; view='plans'; save(); render(); return;
    }
    a.restEnd = null;
    a.fin = {hr:'', minutes: Math.max(1, Math.round((Date.now()-a.startedAt)/60000)),
      prof: {...(S.profile || {sex:'m', age:'', weight:''})}, editProfile: !S.profile};
    view='finish'; save(); render(); window.scrollTo(0,0);
  },
  backToWorkout: () => { delete S.active.fin; view='workout'; save(); render(); },
  sex: d => { S.active.fin.prof.sex = d.s; render(); },
  editProf: () => { S.active.fin.editProfile = true; render(); },
  saveWorkout: () => {
    const a = S.active, f = a.fin;
    const hrRaw = String(f.hr).trim();
    const minutes = parseFloat(f.minutes);
    if(!(minutes>0)){ toast('Wpisz czas treningu w minutach'); return; }
    let hr = null, kcal = null;
    if(hrRaw){
      hr = parseInt(hrRaw);
      if(!(hr>=40 && hr<=220)){ toast('Tętno powinno mieścić się między 40 a 220'); return; }
      kcal = calcKcal(hr, minutes, f.prof);
      if(kcal==null){ toast('Uzupełnij wiek (10–100) i wagę (30–300 kg)'); f.editProfile=true; render(); return; }
      S.profile = {sex: f.prof.sex==='k'?'k':'m', age: parseInt(f.prof.age), weight: parseFloat(String(f.prof.weight).replace(',','.'))};
    }
    const setCount = a.exercises.filter(x=>!x.warmup).reduce((n,x)=>n+x.done.length,0);
    const volume = a.exercises.filter(x=>!x.warmup).reduce((v,x)=>v+x.done.reduce((s,d)=>s+d.kg*d.reps,0),0);
    S.history.push({id:uid(), name:a.name, color:a.color, startedAt:a.startedAt, duration:minutes*60000,
      setCount, volume, hr, kcal, week: a.week ?? null, programKey: a.programKey ?? null, exercises:a.exercises.filter(x=>!(x.warmup && !x.ramp)).map(x=>({name:x.name, done:x.done, warmup:!!x.warmup, target:{sets:x.sets, reps:x.reps, label:x.label||null, kg:x.kg ?? null, star:!!x.star}}))});
    releaseAwake(); S.active = null; view='history'; save(); render(); window.scrollTo(0,0);
    toast(kcal!=null ? `Trening zapisany · ${kcal} kcal` : 'Trening zapisany');
  },
  delHist: d => {
    if(!confirm('Usunąć ten trening z historii?')) return;
    S.history = S.history.filter(h=>h.id!==d.id); save(); render();
  },
  addProgram: () => {
    S.plans = S.plans.filter(p=>p.programId!==PROGRAM.id);
    PROGRAM.plans.forEach(pl => S.plans.push({
      id: uid(), name: pl.name, color: pl.color, programId: PROGRAM.id, programKey: pl.key,
      exercises: JSON.parse(JSON.stringify(pl.exercises))
    }));
    const today = todayStart(), def = parseDay(PROGRAM.start);
    S.program = {id: PROGRAM.id, start: today > def + 6*DAY ? shiftDate(PROGRAM.start, Math.floor((today-def)/DAY)) : PROGRAM.start};
    ensureWarmups(); save(); render(); toast('Program dodany — 4 dni treningowe i test');
  },
  restoreProgram: () => {
    const keys = PROGRAM.plans.map(pl=>pl.key);
    PROGRAM.plans.forEach((pl, k) => {
      if(S.plans.some(p => p.programId===PROGRAM.id && p.programKey===pl.key)) return;
      const plan = {id: uid(), name: pl.name, color: pl.color, programId: PROGRAM.id, programKey: pl.key,
        exercises: JSON.parse(JSON.stringify(pl.exercises))};
      // wstaw za poprzednim dniem programu, żeby zachować kolejność
      let at = -1;
      S.plans.forEach((p, i) => { if(p.programId===PROGRAM.id && keys.indexOf(p.programKey) < k) at = i; });
      S.plans.splice(at + 1, 0, plan);
    });
    ensureWarmups(); save(); render(); toast('Przywrócono brakujące plany');
  },
  progShift: d => { S.program.start = shiftDate(S.program.start, +d.d); save(); render(); },
  toggleSet: d => {
    S.settings[d.k] = !S.settings[d.k]; save(); render();
    if(d.k==='sound' && S.settings.sound){ unlockAudio(); ringAlarm(); }
    if(d.k==='awake'){ S.settings.awake ? keepAwake() : releaseAwake(); }
  },
  testAlarm: () => { unlockAudio(); ringAlarm(true); },
  backup: async () => {
    const json = JSON.stringify(S);
    try{ await navigator.clipboard.writeText(json); toast('Dane skopiowane. Wklej je do notatki.'); }
    catch(e){ window.prompt('Skopiuj ten tekst i zachowaj go w notatce:', json); }
  },
  restore: () => {
    const raw = window.prompt('Wklej skopiowane wcześniej dane:');
    if(!raw) return;
    try{
      applyData(raw.trim()); ensureWarmups(); fillHistoryWeeks(); applyAdjustments();
      view = S.active ? (S.active.fin ? 'finish' : 'workout') : 'plans';
      save(); render(); toast('Dane wczytane');
    }catch(e){ toast('To nie wygląda na dane z aplikacji'); }
  },
  /* editor */
  new: () => { editing = {id:uid(), name:'', color:'blue', isNew:true, exercises:[ex('',3,10,90)]}; view='editor'; render(); window.scrollTo(0,0); },
  edit: d => {
    const p = S.plans.find(x=>x.id===d.id); if(!p) return;
    editing = JSON.parse(JSON.stringify(p)); view='editor'; render(); window.scrollTo(0,0);
  },
  color: d => { editing.color = d.c; render(); },
  moveEx: d => {
    const i = +d.i, j = i + (+d.d), list = editing.exercises;
    if(j<0 || j>=list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    editing.movedTo = j; render();
    const btn = document.querySelector(`[data-a="moveEx"][data-i="${j}"][data-d="${d.d}"]`) || document.querySelector(`[data-a="moveEx"][data-i="${j}"]:not(:disabled)`);
    btn?.focus({preventScroll:true});
    btn?.closest('.exrow')?.scrollIntoView({block:'nearest'});
    clearTimeout(window.__mvT); window.__mvT = setTimeout(()=>{ delete editing?.movedTo; document.querySelector('.exrow.moved')?.classList.remove('moved'); }, 900);
  },
  addEx: () => { editing.exercises.push(ex('',3,10,90)); render(); },
  delEx: d => { editing.exercises.splice(+d.i,1); render(); },
  cancelEdit: () => { editing=null; view='plans'; render(); },
  savePlan: () => {
    const p = editing;
    p.name = p.name.trim();
    p.exercises = p.exercises.filter(x=>x.name.trim()).map(x=>({
      ...x, name:x.name.trim(), sets:Math.max(1,parseInt(x.sets)||3), reps:Math.max(1,parseInt(x.reps)||10), rest:Math.max(0,parseInt(x.rest)||60)}));
    if(!p.name){ toast('Nadaj planowi nazwę'); render(); return; }
    if(!p.exercises.length){ toast('Dodaj przynajmniej jedno ćwiczenie'); p.exercises=[ex('',3,10,90)]; render(); return; }
    const isNew = p.isNew; delete p.isNew; delete p.movedTo;
    if(isNew) S.plans.push(p); else S.plans = S.plans.map(x=>x.id===p.id?p:x);
    editing=null; view='plans'; save(); render(); toast('Plan zapisany');
  },
  delPlan: () => {
    if(!confirm('Usunąć ten plan? Historia treningów zostanie.')) return;
    S.plans = S.plans.filter(x=>x.id!==editing.id); editing=null; view='plans'; save(); render();
  },
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if(!t || t.disabled) return;
  const fn = actions[t.dataset.a]; if(fn) fn(t.dataset);
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.cur && S.active){ S.active.cur[t.dataset.cur] = t.value; }
  if(S.active?.fin && t.dataset.fin){ S.active.fin[t.dataset.fin] = t.value; updKcal(); }
  if(S.active?.fin && t.dataset.prof){ S.active.fin.prof[t.dataset.prof] = t.value; updKcal(); }
  if(editing && t.dataset.pf){ editing[t.dataset.pf] = t.value; }
  if(editing && t.dataset.ef){ editing.exercises[+t.dataset.ei][t.dataset.ef] = t.value; }
});

document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.progstart !== undefined && t.value && S.program){ S.program.start = t.value; save(); render(); }
});

/* ---------- ticking clock ---------- */
setInterval(() => {
  const a = S.active; if(!a) return;
  if(view==='workout'){
    const el = document.getElementById('elapsed'); if(el) el.textContent = fmtTime((Date.now()-a.startedAt)/1000);
  }
  if(!a.restEnd) return;
  const left = (a.restEnd - Date.now())/1000;
  if(left <= 0){
    a.restEnd = null; lastBeep = null;
    ringAlarm();
    toast('Koniec przerwy — następna seria');
    save(); if(view==='workout') render();
    return;
  }
  const sec = Math.ceil(left);
  if(sec <= 3 && sec !== lastBeep){ lastBeep = sec; tick(); }
  if(view==='workout'){
    const r = document.getElementById('restLeft'); if(r) r.textContent = fmtTime(left);
    const bar = document.getElementById('ringBar');
    if(bar){ const C=2*Math.PI*96; bar.setAttribute('stroke-dashoffset', C*(1-left/a.restTotal)); }
  }
}, 250);

load().then(()=>{ S.settings = {...DEFAULT_SETTINGS, ...(S.settings||{})}; const before = JSON.stringify(S.plans); ensureWarmups(); const hw = fillHistoryWeeks(); const adj = applyAdjustments(); if(hw || adj || JSON.stringify(S.plans)!==before) save(); if(adj) setTimeout(()=>toast('Wprowadzono korekty ciężarów z analizy tygodnia 1'), 400); if(S.active) view = S.active.fin ? 'finish' : 'workout'; render(); });
</script>
</body>
